name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Сборка на чистой машине
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов и сборка
        run: npm run build

      - name: Публикация бандла
        uses: actions/upload-artifact@v4
        with:
          name: pokemap-widget-umd
          path: dist/
          retention-days: 14
